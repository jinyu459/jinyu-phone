name: Build APK

# 触发方式：
#   1) 网页上手动点 “Run workflow”
#   2) 推送 v1.0 这类 tag 时自动运行
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java 21
        # Capacitor 7/8 需要 JDK 21；若构建报 Java 版本错误，可改成 17 再试
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        # 需要仓库里存在 package-lock.json，务必一起提交
        run: npm ci

      - name: 准备网页文件到 www/
        run: |
          rm -rf www
          mkdir -p www
          cp index.html admin.html auth.html www/
          cp -r apps assets www/

      - name: 同步 Capacitor 到 Android 工程
        run: npx cap sync android

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jinyu-phone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
