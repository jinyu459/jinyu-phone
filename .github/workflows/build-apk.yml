name: Build APK

# 触发方式：
#   1) 网页上手动点 “Run workflow”
#   2) 推送 v1.0 这类 tag 时自动运行
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        # Capacitor 8 的 CLI 强制要求 Node >= 22；
        # 若装 Node 20，会在此后的 "同步 Capacitor" 步骤直接报 [fatal] 并 exit 1
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 21
        # Capacitor 7/8 需要 JDK 21；若构建报 Java 版本错误，可改成 17 再试
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 校验签名 Secrets 是否齐全（缺失即失败，禁止回退 debug 签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少以下 GitHub Secrets:$missing。请在仓库 Settings → Secrets and variables → Actions 中补齐后再运行。"
            exit 1
          fi
          echo "签名 Secrets 校验通过。"

      - name: 安装依赖
        # 需要仓库里存在 package-lock.json，务必一起提交
        run: npm ci

      - name: 准备网页文件到 www/
        run: |
          rm -rf www
          mkdir -p www
          cp index.html admin.html auth.html www/
          cp -r apps assets www/

      - name: 同步 Capacitor 到 Android 工程
        run: npx cap sync android

      - name: 写入固定签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: 编译 Release APK（固定签名 + versionCode 自动递增）
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: 打印 APK 签名指纹（核对是否固定）
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          echo "APK: $APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -n1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jinyu-phone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
